spring:
  application:
    name: hsu-hub-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hsu_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:hsu_hub}
    password: ${DB_PASSWORD:hsu_hub_local}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
hsu:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hsu-hub.site,https://admin.hsu-hub.site}
  security:
    secure-cookies: ${SECURE_COOKIES:true}
    csrf-cookie-name: ${CSRF_COOKIE_NAME:__Host-XSRF-TOKEN}
  kakao:
    client-id: ${HSU_KAKAO_CLIENT_ID}
    client-secret: ${HSU_KAKAO_CLIENT_SECRET}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    applicant-origin: ${HSU_KAKAO_APPLICANT_ORIGIN:https://hsu-hub.site}
    admin-origin: ${HSU_KAKAO_ADMIN_ORIGIN:https://admin.hsu-hub.site}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: local,dev
hsu:
  storage:
    local-path: ${LOCAL_STORAGE_PATH:.local-storage}
  security:
    secure-cookies: false
    csrf-cookie-name: XSRF-TOKEN
