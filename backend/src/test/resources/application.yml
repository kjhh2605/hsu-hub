spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:hsuhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
  main:
    allow-bean-definition-overriding: true
hsu:
  cors:
    allowed-origins: https://hsu-hub.site,https://admin.hsu-hub.site
  storage:
    local-path: ${java.io.tmpdir}/hsu-hub-test-storage
