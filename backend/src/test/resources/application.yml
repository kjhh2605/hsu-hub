spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:hsuhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
  main:
    allow-bean-definition-overriding: true
hsu:
  cors:
    allowed-origins: https://hsu-hub.site,https://admin.hsu-hub.site
  kakao:
    client-id: test-client-id
    client-secret: test-client-secret
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    applicant-origin: https://hsu-hub.site
    admin-origin: https://admin.hsu-hub.site
  storage:
    local-path: ${java.io.tmpdir}/hsu-hub-test-storage
